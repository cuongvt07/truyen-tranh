services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-lunelit}
      MARIADB_USER: ${DB_USERNAME:-lunelit}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  queue:
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
