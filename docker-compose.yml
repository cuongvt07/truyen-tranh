services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: truyen-tranh-app:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
      REDIS_HOST: redis
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RUN_SEEDERS:-false}
      RUN_CACHE_WARMUP: ${RUN_CACHE_WARMUP:-true}
    volumes:
      - app-storage:/var/www/html/storage
      - public-storage:/var/www/html/storage/app/public
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: truyen-tranh-nginx:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - public-storage:/var/www/html/public/storage:ro
    depends_on:
      - app

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: truyen-tranh-app:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=90"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
      RUN_CACHE_WARMUP: ${RUN_CACHE_WARMUP:-true}
    volumes:
      - app-storage:/var/www/html/storage
      - public-storage:/var/www/html/storage/app/public
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-storage:
  public-storage:
  redis-data:
